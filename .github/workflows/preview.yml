# A preview deploy of every pull request to Workers from its commit. The job
# checks for its secrets first and skips with a visible notice when they are
# not configured; the workflow itself is always green so a missing secret
# never blocks review.
#
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the Worker must exist
# once, from `npm run deploy`, with its secrets set).
name: Preview deploy

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  workers:
    runs-on: ubuntu-latest
    steps:
      - id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice title=Workers preview::skipped: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID not configured"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run build
      - id: upload
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }} ${{ github.event.pull_request.head.sha }}" | tee upload.log
          url="$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready == 'true' && steps.upload.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = "<!-- preview-deploys -->";
            const body = [marker, "Preview deploy for " + context.sha, "", "| Host | URL |", "| --- | --- |", `| Cloudflare Workers | ${process.env.URL} |`].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
