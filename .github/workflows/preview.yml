# Preview deploys of every pull request to both hosts from the same commit.
# Each host job checks for its secrets first and skips with a visible notice
# when they are not configured; the workflow itself is always green so a
# missing secret never blocks review.
#
# Workers: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the Worker must exist
# once, from `npx wrangler deploy`, with its secrets set).
# Vercel:  VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (the project's
# preview environment variables hold the configuration).
name: Preview deploys

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: dist/client
          retention-days: 1

  workers:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice title=Workers preview::skipped: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID not configured"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: client
          path: dist/client
      - id: upload
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }} ${{ github.event.pull_request.head.sha }}" | tee upload.log
          url="$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  vercel:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - id: secrets
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ORG" ] || [ -z "$PROJECT" ]; then
            echo "::notice title=Vercel preview::skipped: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID not configured"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel@latest build --token="$VERCEL_TOKEN"
          url="$(npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  comment:
    needs: [workers, vercel]
    if: needs.workers.outputs.url != '' || needs.vercel.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          WORKERS_URL: ${{ needs.workers.outputs.url }}
          VERCEL_URL: ${{ needs.vercel.outputs.url }}
        with:
          script: |
            const marker = "<!-- preview-deploys -->";
            const rows = [
              ["Cloudflare Workers", process.env.WORKERS_URL],
              ["Vercel", process.env.VERCEL_URL],
            ].map(([host, url]) => `| ${host} | ${url ? url : "not configured"} |`);
            const body = [marker, "Preview deploys for " + context.sha, "", "| Host | URL |", "| --- | --- |", ...rows].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
