# The screenshot loop on every pull request: the real application rendering
# every state from the recordings, captured at both viewports in both themes.
# A state that does not render fails the job; the captures are the artifact
# reviewers read against design/review-checklist.md. The live acceptance
# spec does not run here: it needs a live target, which CI never has.
name: Screenshots

on:
  pull_request:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: design/screens/app
          retention-days: 14
          if-no-files-found: error
